<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>
        GraphQL Product Admin
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <style>

        body {
            background: #1f2226;
            color: #f5f5f5;
            min-height: 100vh;
        }


        .navbar {
            background: #212529;
        }


        .main-container {
            max-width: 1500px;
            margin: 35px auto;
            padding: 0 20px;
        }


        .content-box {
            background: #111;
            border-radius: 18px;
            padding: 30px;
        }


        .table {
            --bs-table-bg: transparent;
            --bs-table-color: #f5f5f5;
            --bs-table-border-color: #444;
        }


        .product-image {
            width: 110px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #444;
        }


        .no-image {
            color: #aaa;
        }


        .pagination .page-link {
            background: #191919;
            border-color: #444;
            color: #fff;
        }


        .pagination .page-item.active .page-link {
            background: #0d6efd;
            border-color: #0d6efd;
        }


        .modal-content {
            background: #191919;
            color: #fff;
        }


        .form-control,
        .form-select {
            background-color: #111;
            color: #fff;
            border-color: #555;
        }


        .form-control:focus,
        .form-select:focus {
            background-color: #111;
            color: #fff;
        }


        .description-column {
            max-width: 250px;
            word-break: break-word;
        }


        footer {
            text-align: center;
            padding: 25px;
            color: #ccc;
        }

    </style>

</head>


<body>


<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container-fluid px-4">

        <a
            class="navbar-brand fw-bold"
            href="/graphql-ui/home">

            WEBPR330479 - GraphQL

        </a>


        <div class="navbar-nav">

            <a
                class="nav-link"
                href="/graphql-ui/home">

                Home

            </a>


            <a
                class="nav-link"
                href="/admin/graphql/categories">

                Category

            </a>


            <a
                class="nav-link active"
                href="/admin/graphql/products">

                Product

            </a>

        </div>

    </div>

</nav>


<div class="main-container">

    <div class="content-box">


        <div
            class="d-flex
                   justify-content-between
                   align-items-center
                   mb-4">

            <div>

                <h1 class="mb-1">
                    Product CRUD
                </h1>

                <p class="text-secondary mb-0">
                    Thymeleaf + AJAX + GraphQL
                </p>

            </div>


            <button
                type="button"
                class="btn btn-primary"
                onclick="openCreateModal()">

                + Thêm Product

            </button>

        </div>

        <div class="row g-2 mb-4">

            <div class="col-md-8">

                <input
                    type="text"
                    id="keyword"
                    class="form-control"
                    placeholder="Nhập tên Product cần tìm...">

            </div>


            <div class="col-md-2">

                <select
                    id="pageSize"
                    class="form-select">

                    <option value="5">
                        5 / trang
                    </option>

                    <option value="10">
                        10 / trang
                    </option>

                    <option value="20">
                        20 / trang
                    </option>

                </select>

            </div>


            <div class="col-md-2">

                <button
                    type="button"
                    class="btn btn-outline-primary w-100"
                    onclick="searchProduct()">

                    Tìm kiếm

                </button>

            </div>

        </div>

        <div
            id="messageBox"
            class="alert d-none">
        </div>

        <div class="table-responsive">

            <table
                class="table table-hover align-middle">

                <thead>

                <tr>

                    <th>STT</th>

                    <th>ID</th>

                    <th>Ảnh</th>

                    <th>Tên Product</th>

                    <th>Mô tả</th>

                    <th>Giá</th>

                    <th>Category</th>

                    <th>Action</th>

                </tr>

                </thead>


                <tbody id="productTableBody">

                <tr>

                    <td
                        colspan="8"
                        class="text-center">

                        Đang tải...

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

        <nav class="mt-4">

            <ul
                id="pagination"
                class="pagination justify-content-center">
            </ul>

        </nav>


    </div>

</div>

<div
    class="modal fade"
    id="productModal"
    tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">


            <form id="productForm">


                <div class="modal-header">

                    <h5
                        id="modalTitle"
                        class="modal-title">

                        Thêm Product

                    </h5>


                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                    </button>

                </div>


                <div class="modal-body">


                    <input
                        type="hidden"
                        id="productId">

                    <div class="mb-3">

                        <label
                            for="productName"
                            class="form-label">

                            Tên Product

                        </label>


                        <input
                            type="text"
                            id="productName"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label
                            for="description"
                            class="form-label">

                            Mô tả

                        </label>


                        <textarea
                            id="description"
                            class="form-control"
                            rows="3">
                        </textarea>

                    </div>


                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label
                                for="price"
                                class="form-label">

                                Giá

                            </label>


                            <input
                                type="number"
                                id="price"
                                class="form-control"
                                min="0"
                                step="1"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label
                                for="categoryId"
                                class="form-label">

                                Category

                            </label>


                            <select
                                id="categoryId"
                                class="form-select"
                                required>

                                <option value="">
                                    -- Chọn Category --
                                </option>

                            </select>

                        </div>

                    </div>

                    <div class="mb-3">

                        <label
                            for="image"
                            class="form-label">

                            Tên file ảnh

                        </label>


                        <input
                            type="text"
                            id="image"
                            class="form-control"
                            placeholder="Ví dụ: product.jpg">


                        <div class="form-text">

                            Khi cập nhật, để trống nếu muốn giữ ảnh cũ.

                        </div>

                    </div>


                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Đóng

                    </button>


                    <button
                        type="submit"
                        id="saveButton"
                        class="btn btn-primary">

                        Lưu

                    </button>

                </div>


            </form>

        </div>

    </div>

</div>


<footer>

    24162111 - Đoàn Thành Tâm

</footer>


<script>

    const GRAPHQL_URL =
        "/graphql";


    let currentPage =
        0;


    let totalPages =
        0;


    let productModal;


    document.addEventListener(
        "DOMContentLoaded",
        function () {

            productModal =
                bootstrap.Modal
                    .getOrCreateInstance(
                        document.getElementById(
                            "productModal"
                        )
                    );


            loadProducts();


            document
                .getElementById(
                    "productForm"
                )
                .addEventListener(
                    "submit",
                    function (event) {

                        event.preventDefault();

                        saveProduct();
                    }
                );


            document
                .getElementById(
                    "keyword"
                )
                .addEventListener(
                    "keydown",
                    function (event) {

                        if (
                            event.key
                            === "Enter"
                        ) {

                            searchProduct();
                        }
                    }
                );


            document
                .getElementById(
                    "pageSize"
                )
                .addEventListener(
                    "change",
                    function () {

                        currentPage =
                            0;

                        loadProducts();
                    }
                );
        }
    );

    async function graphqlRequest(
            query,
            variables) {

        const response =
            await fetch(
                GRAPHQL_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            {

                                query:
                                    query,

                                variables:
                                    variables || {}
                            }
                        )
                }
            );


        const result =
            await response.json();


        if (
            result.errors
            && result.errors.length > 0
        ) {

            throw new Error(
                result.errors[0].message
            );
        }


        return result.data;
    }


    async function loadProducts() {

        const keyword =
            document
                .getElementById(
                    "keyword"
                )
                .value
                .trim();


        const size =
            Number(
                document
                    .getElementById(
                        "pageSize"
                    )
                    .value
            );


        const query =

            "query ProductPage("
            + "$keyword: String, "
            + "$page: Int, "
            + "$size: Int"
            + ") {"

            + " productPage("
            + " keyword: $keyword, "
            + " page: $page, "
            + " size: $size"
            + " ) {"

            + " content {"

            + "   productId"
            + "   productName"
            + "   description"
            + "   price"
            + "   image"

            + "   category {"
            + "       categoryId"
            + "       categoryName"
            + "   }"

            + " }"

            + " page"
            + " size"
            + " totalElements"
            + " totalPages"
            + " first"
            + " last"

            + " }"

            + "}";


        try {

            const data =
                await graphqlRequest(

                    query,

                    {

                        keyword:
                            keyword,

                        page:
                            currentPage,

                        size:
                            size
                    }
                );


            renderProducts(
                data.productPage
            );

        } catch (error) {

            showMessage(
                error.message,
                false
            );
        }
    }


    function renderProducts(
            pageData) {

        const tbody =
            document.getElementById(
                "productTableBody"
            );


        tbody.innerHTML =
            "";


        currentPage =
            pageData.page;


        totalPages =
            pageData.totalPages;


        if (
            !pageData.content
            || pageData.content.length === 0
        ) {

            tbody.innerHTML =

                "<tr>"
                + "<td colspan='8' "
                + "class='text-center'>"
                + "Không có Product."
                + "</td>"
                + "</tr>";


            renderPagination();

            return;
        }


        pageData.content
            .forEach(
                function (
                    product,
                    index) {


                    const tr =
                        document
                            .createElement(
                                "tr"
                            );


                    const stt =
                        currentPage
                        * pageData.size
                        + index
                        + 1;


                    let imageHtml =

                        "<span class='no-image'>"
                        + "Chưa có ảnh"
                        + "</span>";


                    if (product.image) {

                        imageHtml =

                            "<img "
                            + "class='product-image' "
                            + "src='/product-image?fname="
                            + encodeURIComponent(
                                product.image
                            )
                            + "' "
                            + "alt='Product'>";
                    }


                    let categoryName =
                        "";


                    if (
                        product.category
                        && product.category.categoryName
                    ) {

                        categoryName =
                            product
                                .category
                                .categoryName;
                    }


                    tr.innerHTML =

                        "<td>"
                        + stt
                        + "</td>"

                        + "<td>"
                        + product.productId
                        + "</td>"

                        + "<td>"
                        + imageHtml
                        + "</td>"

                        + "<td>"
                        + escapeHtml(
                            product.productName
                        )
                        + "</td>"

                        + "<td class='description-column'>"
                        + escapeHtml(
                            product.description
                            || ""
                        )
                        + "</td>"

                        + "<td>"
                        + formatPrice(
                            product.price
                        )
                        + "</td>"

                        + "<td>"
                        + escapeHtml(
                            categoryName
                        )
                        + "</td>"

                        + "<td>"

                        + "<button "
                        + "class='btn btn-sm btn-warning me-2' "
                        + "onclick='openEditModal("
                        + product.productId
                        + ")'>"
                        + "Sửa"
                        + "</button>"

                        + "<button "
                        + "class='btn btn-sm btn-danger' "
                        + "onclick='deleteProduct("
                        + product.productId
                        + ")'>"
                        + "Xóa"
                        + "</button>"

                        + "</td>";


                    tbody.appendChild(
                        tr
                    );
                }
            );


        renderPagination();
    }

    function searchProduct() {

        currentPage =
            0;

        loadProducts();
    }

    function renderPagination() {

        const pagination =
            document.getElementById(
                "pagination"
            );


        pagination.innerHTML =
            "";


        if (totalPages <= 1) {
            return;
        }


        createPageButton(

            "Trước",

            currentPage - 1,

            currentPage === 0
        );


        for (
            let i = 0;
            i < totalPages;
            i++
        ) {

            createPageButton(

                String(i + 1),

                i,

                false,

                i === currentPage
            );
        }


        createPageButton(

            "Sau",

            currentPage + 1,

            currentPage
                >= totalPages - 1
        );
    }


    function createPageButton(
            text,
            page,
            disabled,
            active) {

        const li =
            document.createElement(
                "li"
            );


        li.className =
            "page-item";


        if (disabled) {

            li.classList.add(
                "disabled"
            );
        }


        if (active) {

            li.classList.add(
                "active"
            );
        }


        const button =
            document.createElement(
                "button"
            );


        button.className =
            "page-link";


        button.textContent =
            text;


        button.addEventListener(
            "click",
            function () {

                if (disabled) {
                    return;
                }


                currentPage =
                    page;


                loadProducts();
            }
        );


        li.appendChild(
            button
        );


        document
            .getElementById(
                "pagination"
            )
            .appendChild(
                li
            );
    }

    async function loadCategoryOptions(
            selectedCategoryId) {

        const query =

            "query {"

            + " categories {"
            + "   categoryId"
            + "   categoryName"
            + "   status"
            + " }"

            + "}";


        const data =
            await graphqlRequest(
                query
            );


        const select =
            document.getElementById(
                "categoryId"
            );


        select.innerHTML =

            "<option value=''>"
            + "-- Chọn Category --"
            + "</option>";


        data.categories
            .forEach(
                function (category) {

                    const option =
                        document
                            .createElement(
                                "option"
                            );


                    option.value =
                        category.categoryId;


                    option.textContent =
                        category.categoryName;


                    select.appendChild(
                        option
                    );
                }
            );


        if (
            selectedCategoryId !== null
            && selectedCategoryId !== undefined
        ) {

            select.value =
                String(
                    selectedCategoryId
                );
        }
    }

    async function openCreateModal() {

        document
            .getElementById(
                "productForm"
            )
            .reset();


        document
            .getElementById(
                "productId"
            )
            .value =
                "";


        document
            .getElementById(
                "modalTitle"
            )
            .textContent =
                "Thêm Product";


        try {

            await loadCategoryOptions(
                null
            );


            productModal.show();

        } catch (error) {

            showMessage(
                error.message,
                false
            );
        }
    }

    async function openEditModal(
            id) {

        const query =

            "query ProductById($id: Int!) {"

            + " productById(id: $id) {"

            + "   productId"
            + "   productName"
            + "   description"
            + "   price"
            + "   image"

            + "   category {"
            + "       categoryId"
            + "       categoryName"
            + "   }"

            + " }"

            + "}";


        try {

            const data =
                await graphqlRequest(

                    query,

                    {
                        id:
                            id
                    }
                );


            const product =
                data.productById;


            if (!product) {

                showMessage(
                    "Không tìm thấy Product.",
                    false
                );

                return;
            }


            document
                .getElementById(
                    "productId"
                )
                .value =
                    product.productId;


            document
                .getElementById(
                    "productName"
                )
                .value =
                    product.productName
                    || "";


            document
                .getElementById(
                    "description"
                )
                .value =
                    product.description
                    || "";


            document
                .getElementById(
                    "price"
                )
                .value =
                    product.price;


            document
                .getElementById(
                    "image"
                )
                .value =
                    product.image
                    || "";


            let selectedCategoryId =
                null;


            if (product.category) {

                selectedCategoryId =
                    product
                        .category
                        .categoryId;
            }


            await loadCategoryOptions(
                selectedCategoryId
            );


            document
                .getElementById(
                    "modalTitle"
                )
                .textContent =
                    "Cập nhật Product";


            productModal.show();

        } catch (error) {

            showMessage(
                error.message,
                false
            );
        }
    }

    async function saveProduct() {

        const id =
            document
                .getElementById(
                    "productId"
                )
                .value;


        const productName =
            document
                .getElementById(
                    "productName"
                )
                .value
                .trim();


        const description =
            document
                .getElementById(
                    "description"
                )
                .value
                .trim();


        const price =
            Number(
                document
                    .getElementById(
                        "price"
                    )
                    .value
            );


        const categoryId =
            Number(
                document
                    .getElementById(
                        "categoryId"
                    )
                    .value
            );


        const imageValue =
            document
                .getElementById(
                    "image"
                )
                .value
                .trim();


        if (!productName) {

            showMessage(
                "Tên Product không được để trống.",
                false
            );

            return;
        }


        if (
            Number.isNaN(price)
            || price < 0
        ) {

            showMessage(
                "Giá Product không hợp lệ.",
                false
            );

            return;
        }


        if (
            Number.isNaN(categoryId)
            || categoryId <= 0
        ) {

            showMessage(
                "Vui lòng chọn Category.",
                false
            );

            return;
        }


        const input = {

            productName:
                productName,

            description:
                description,

            price:
                price,

            categoryId:
                categoryId
        };

        if (imageValue !== "") {

            input.image =
                imageValue;
        }


        try {

            if (id === "") {

                await createProduct(
                    input
                );


                showMessage(
                    "Thêm Product thành công.",
                    true
                );

            } else {

                await updateProduct(

                    Number(id),

                    input
                );


                showMessage(
                    "Cập nhật Product thành công.",
                    true
                );
            }


            productModal.hide();


            loadProducts();

        } catch (error) {

            showMessage(
                error.message,
                false
            );
        }
    }

    async function createProduct(
            input) {

        const mutation =

            "mutation CreateProduct("
            + "$input: ProductInput!"
            + ") {"

            + " createProduct("
            + " input: $input"
            + " ) {"

            + "   productId"
            + "   productName"
            + "   description"
            + "   price"
            + "   image"

            + "   category {"
            + "       categoryId"
            + "       categoryName"
            + "   }"

            + " }"

            + "}";


        return graphqlRequest(

            mutation,

            {
                input:
                    input
            }
        );
    }

    async function updateProduct(
            id,
            input) {

        const mutation =

            "mutation UpdateProduct("
            + "$id: Int!, "
            + "$input: ProductInput!"
            + ") {"

            + " updateProduct("
            + " id: $id, "
            + " input: $input"
            + " ) {"

            + "   productId"
            + "   productName"
            + "   description"
            + "   price"
            + "   image"

            + "   category {"
            + "       categoryId"
            + "       categoryName"
            + "   }"

            + " }"

            + "}";


        return graphqlRequest(

            mutation,

            {

                id:
                    id,

                input:
                    input
            }
        );
    }

    async function deleteProduct(
            id) {

        const confirmed =
            confirm(
                "Bạn có chắc muốn xóa Product này?"
            );


        if (!confirmed) {
            return;
        }


        const mutation =

            "mutation DeleteProduct("
            + "$id: Int!"
            + ") {"

            + " deleteProduct("
            + " id: $id"
            + " )"

            + "}";


        try {

            await graphqlRequest(

                mutation,

                {
                    id:
                        id
                }
            );


            showMessage(
                "Xóa Product thành công.",
                true
            );


            loadProducts();

        } catch (error) {

            showMessage(
                error.message,
                false
            );
        }
    }

    function formatPrice(
            value) {

        if (
            value === null
            || value === undefined
        ) {

            return "";
        }


        return new Intl.NumberFormat(
            "vi-VN"
        ).format(
            Number(value)
        )
        + " đ";
    }

    function showMessage(
            message,
            success) {

        const box =
            document.getElementById(
                "messageBox"
            );


        box.className =
            success

            ? "alert alert-success"

            : "alert alert-danger";


        box.textContent =
            message;
    }

    function escapeHtml(
            value) {

        if (
            value === null
            || value === undefined
        ) {

            return "";
        }


        return String(value)

            .replaceAll(
                "&",
                "&amp;"
            )

            .replaceAll(
                "<",
                "&lt;"
            )

            .replaceAll(
                ">",
                "&gt;"
            )

            .replaceAll(
                '"',
                "&quot;"
            )

            .replaceAll(
                "'",
                "&#039;"
            );
    }

</script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
