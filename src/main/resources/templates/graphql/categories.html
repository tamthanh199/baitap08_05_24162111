<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>
        GraphQL Category Admin
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <style>

        body {
            background: #1f2226;
            color: #f5f5f5;
            min-height: 100vh;
        }


        .navbar {
            background: #212529;
        }


        .main-container {
            max-width: 1450px;
            margin: 35px auto;
            padding: 0 20px;
        }


        .content-box {
            background: #111;
            border-radius: 18px;
            padding: 30px;
        }


        .table {
            --bs-table-bg: transparent;
            --bs-table-color: #f5f5f5;
            --bs-table-border-color: #444;
        }


        .category-image {
            width: 100px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #444;
        }


        .no-image {
            color: #aaa;
        }


        .pagination .page-link {
            background: #191919;
            border-color: #444;
            color: #fff;
        }


        .pagination .page-item.active .page-link {
            background: #0d6efd;
            border-color: #0d6efd;
        }


        .modal-content {
            background: #191919;
            color: #fff;
        }


        .form-control,
        .form-select {
            background-color: #111;
            color: #fff;
            border-color: #555;
        }


        .form-control:focus,
        .form-select:focus {
            background-color: #111;
            color: #fff;
        }


        footer {
            text-align: center;
            padding: 25px;
            color: #ccc;
        }

    </style>

</head>


<body>


<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container-fluid px-4">

        <a
            class="navbar-brand fw-bold"
            href="/graphql-ui/home">

            WEBPR330479 - GraphQL

        </a>


        <div class="navbar-nav">

            <a
                class="nav-link"
                href="/graphql-ui/home">

                Home

            </a>


            <a
                class="nav-link active"
                href="/admin/graphql/categories">

                Category

            </a>


            <a
                class="nav-link"
                href="/admin/graphql/products">

                Product

            </a>

        </div>

    </div>

</nav>


<div class="main-container">

    <div class="content-box">


        <div
            class="d-flex
                   justify-content-between
                   align-items-center
                   mb-4">

            <div>

                <h1 class="mb-1">
                    Category CRUD
                </h1>

                <p class="text-secondary mb-0">

                    Thymeleaf + AJAX + GraphQL

                </p>

            </div>


            <button
                type="button"
                class="btn btn-primary"
                onclick="openCreateModal()">

                + Thêm Category

            </button>

        </div>

        <div class="row g-2 mb-4">

            <div class="col-md-8">

                <input
                    type="text"
                    id="keyword"
                    class="form-control"
                    placeholder="Nhập tên Category cần tìm...">

            </div>


            <div class="col-md-2">

                <select
                    id="pageSize"
                    class="form-select">

                    <option value="5">
                        5 / trang
                    </option>

                    <option value="10">
                        10 / trang
                    </option>

                    <option value="20">
                        20 / trang
                    </option>

                </select>

            </div>


            <div class="col-md-2">

                <button
                    type="button"
                    class="btn btn-outline-primary w-100"
                    onclick="searchCategory()">

                    Tìm kiếm

                </button>

            </div>

        </div>

        <div
            id="messageBox"
            class="alert d-none">
        </div>

        <div class="table-responsive">

            <table
                class="table table-hover align-middle">

                <thead>

                <tr>

                    <th>STT</th>

                    <th>ID</th>

                    <th>Ảnh</th>

                    <th>Tên Category</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

                </thead>


                <tbody id="categoryTableBody">

                <tr>

                    <td
                        colspan="6"
                        class="text-center">

                        Đang tải...

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

        <nav class="mt-4">

            <ul
                id="pagination"
                class="pagination justify-content-center">
            </ul>

        </nav>


    </div>

</div>

<div
    class="modal fade"
    id="categoryModal"
    tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">


            <form id="categoryForm">


                <div class="modal-header">

                    <h5
                        id="modalTitle"
                        class="modal-title">

                        Thêm Category

                    </h5>


                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                    </button>

                </div>


                <div class="modal-body">


                    <input
                        type="hidden"
                        id="categoryId">


                    <div class="mb-3">

                        <label
                            for="categoryName"
                            class="form-label">

                            Tên Category

                        </label>


                        <input
                            type="text"
                            id="categoryName"
                            class="form-control"
                            required>

                    </div>


                    <div class="mb-3">

                        <label
                            for="icon"
                            class="form-label">

                            Tên file ảnh

                        </label>


                        <input
                            type="text"
                            id="icon"
                            class="form-control"
                            placeholder="Ví dụ: cat.jpg">


                        <div class="form-text">

                            Có thể để trống.
                            Upload file ảnh sẽ xử lý riêng nếu cần.

                        </div>

                    </div>


                    <div class="mb-3">

                        <label
                            for="status"
                            class="form-label">

                            Status

                        </label>


                        <select
                            id="status"
                            class="form-select">

                            <option value="1">
                                Active
                            </option>

                            <option value="0">
                                Inactive
                            </option>

                        </select>

                    </div>


                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Đóng

                    </button>


                    <button
                        type="submit"
                        id="saveButton"
                        class="btn btn-primary">

                        Lưu

                    </button>

                </div>


            </form>

        </div>

    </div>

</div>


<footer>

    24162111 - Đoàn Thành Tâm

</footer>


<script>

    const GRAPHQL_URL =
        "/graphql";


    let currentPage =
        0;


    let totalPages =
        0;


    let categoryModal;


    document.addEventListener(
        "DOMContentLoaded",
        function () {

            categoryModal =
                bootstrap.Modal
                    .getOrCreateInstance(
                        document.getElementById(
                            "categoryModal"
                        )
                    );


            loadCategories();


            document
                .getElementById(
                    "categoryForm"
                )
                .addEventListener(
                    "submit",
                    function (event) {

                        event.preventDefault();

                        saveCategory();
                    }
                );


            document
                .getElementById(
                    "keyword"
                )
                .addEventListener(
                    "keydown",
                    function (event) {

                        if (
                            event.key
                            === "Enter"
                        ) {

                            searchCategory();
                        }
                    }
                );


            document
                .getElementById(
                    "pageSize"
                )
                .addEventListener(
                    "change",
                    function () {

                        currentPage =
                            0;

                        loadCategories();
                    }
                );
        }
    );

    async function graphqlRequest(
            query,
            variables) {

        const response =
            await fetch(
                GRAPHQL_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            {

                                query:
                                    query,

                                variables:
                                    variables || {}
                            }
                        )
                }
            );


        const result =
            await response.json();


        if (
            result.errors
            && result.errors.length > 0
        ) {

            throw new Error(
                result.errors[0].message
            );
        }


        return result.data;
    }

    async function loadCategories() {

        const keyword =
            document
                .getElementById(
                    "keyword"
                )
                .value
                .trim();


        const size =
            Number(
                document
                    .getElementById(
                        "pageSize"
                    )
                    .value
            );


        const query =

            "query CategoryPage("
            + "$keyword: String, "
            + "$page: Int, "
            + "$size: Int"
            + ") {"

            + " categoryPage("
            + " keyword: $keyword, "
            + " page: $page, "
            + " size: $size"
            + " ) {"

            + " content {"
            + "   categoryId"
            + "   categoryName"
            + "   icon"
            + "   status"
            + " }"

            + " page"
            + " size"
            + " totalElements"
            + " totalPages"
            + " first"
            + " last"

            + " }"

            + "}";


        try {

            const data =
                await graphqlRequest(

                    query,

                    {
                        keyword:
                            keyword,

                        page:
                            currentPage,

                        size:
                            size
                    }
                );


            renderCategories(
                data.categoryPage
            );

        } catch (error) {

            showMessage(
                error.message,
                false
            );
        }
    }

    function renderCategories(
            pageData) {

        const tbody =
            document.getElementById(
                "categoryTableBody"
            );


        tbody.innerHTML =
            "";


        currentPage =
            pageData.page;


        totalPages =
            pageData.totalPages;


        if (
            !pageData.content
            || pageData.content.length === 0
        ) {

            tbody.innerHTML =

                "<tr>"
                + "<td colspan='6' "
                + "class='text-center'>"
                + "Không có Category."
                + "</td>"
                + "</tr>";


            renderPagination();

            return;
        }


        pageData.content.forEach(
            function (
                category,
                index) {


                const tr =
                    document.createElement(
                        "tr"
                    );


                const stt =
                    currentPage
                    * pageData.size
                    + index
                    + 1;


                let imageHtml =

                    "<span class='no-image'>"
                    + "Chưa có ảnh"
                    + "</span>";


                if (category.icon) {

                    imageHtml =

                        "<img "
                        + "class='category-image' "
                        + "src='/image?fname="
                        + encodeURIComponent(
                            category.icon
                        )
                        + "' "
                        + "alt='Category'>";
                }


                const statusHtml =

                    category.status === 1

                    ? "<span class='badge bg-success'>Active</span>"

                    : "<span class='badge bg-secondary'>Inactive</span>";


                tr.innerHTML =

                    "<td>"
                    + stt
                    + "</td>"

                    + "<td>"
                    + category.categoryId
                    + "</td>"

                    + "<td>"
                    + imageHtml
                    + "</td>"

                    + "<td>"
                    + escapeHtml(
                        category.categoryName
                    )
                    + "</td>"

                    + "<td>"
                    + statusHtml
                    + "</td>"

                    + "<td>"

                    + "<button "
                    + "class='btn btn-sm btn-warning me-2' "
                    + "onclick='openEditModal("
                    + category.categoryId
                    + ")'>"
                    + "Sửa"
                    + "</button>"

                    + "<button "
                    + "class='btn btn-sm btn-danger' "
                    + "onclick='deleteCategory("
                    + category.categoryId
                    + ")'>"
                    + "Xóa"
                    + "</button>"

                    + "</td>";


                tbody.appendChild(
                    tr
                );
            }
        );


        renderPagination();
    }

    function searchCategory() {

        currentPage =
            0;

        loadCategories();
    }

    function renderPagination() {

        const pagination =
            document.getElementById(
                "pagination"
            );


        pagination.innerHTML =
            "";


        if (totalPages <= 1) {
            return;
        }


        createPageButton(
            "Trước",
            currentPage - 1,
            currentPage === 0
        );


        for (
            let i = 0;
            i < totalPages;
            i++
        ) {

            createPageButton(
                String(i + 1),
                i,
                false,
                i === currentPage
            );
        }


        createPageButton(
            "Sau",
            currentPage + 1,
            currentPage
                >= totalPages - 1
        );
    }


    function createPageButton(
            text,
            page,
            disabled,
            active) {

        const li =
            document.createElement(
                "li"
            );


        li.className =
            "page-item";


        if (disabled) {

            li.classList.add(
                "disabled"
            );
        }


        if (active) {

            li.classList.add(
                "active"
            );
        }


        const button =
            document.createElement(
                "button"
            );


        button.className =
            "page-link";


        button.textContent =
            text;


        button.addEventListener(
            "click",
            function () {

                if (disabled) {
                    return;
                }


                currentPage =
                    page;


                loadCategories();
            }
        );


        li.appendChild(
            button
        );


        document
            .getElementById(
                "pagination"
            )
            .appendChild(
                li
            );
    }

    function openCreateModal() {

        document
            .getElementById(
                "categoryForm"
            )
            .reset();


        document
            .getElementById(
                "categoryId"
            )
            .value =
                "";


        document
            .getElementById(
                "status"
            )
            .value =
                "1";


        document
            .getElementById(
                "modalTitle"
            )
            .textContent =
                "Thêm Category";


        categoryModal.show();
    }

    async function openEditModal(
            id) {

        const query =

            "query CategoryById($id: Int!) {"

            + " categoryById(id: $id) {"

            + "   categoryId"
            + "   categoryName"
            + "   icon"
            + "   status"

            + " }"

            + "}";


        try {

            const data =
                await graphqlRequest(

                    query,

                    {
                        id:
                            id
                    }
                );


            const category =
                data.categoryById;


            if (!category) {

                showMessage(
                    "Không tìm thấy Category.",
                    false
                );

                return;
            }


            document
                .getElementById(
                    "categoryId"
                )
                .value =
                    category.categoryId;


            document
                .getElementById(
                    "categoryName"
                )
                .value =
                    category.categoryName
                    || "";


            document
                .getElementById(
                    "icon"
                )
                .value =
                    category.icon
                    || "";


            document
                .getElementById(
                    "status"
                )
                .value =
                    String(
                        category.status
                    );


            document
                .getElementById(
                    "modalTitle"
                )
                .textContent =
                    "Cập nhật Category";


            categoryModal.show();

        } catch (error) {

            showMessage(
                error.message,
                false
            );
        }
    }

    async function saveCategory() {

        const id =
            document
                .getElementById(
                    "categoryId"
                )
                .value;


        const categoryName =
            document
                .getElementById(
                    "categoryName"
                )
                .value
                .trim();


        const iconValue =
            document
                .getElementById(
                    "icon"
                )
                .value
                .trim();


        const status =
            Number(
                document
                    .getElementById(
                        "status"
                    )
                    .value
            );


        if (!categoryName) {

            showMessage(
                "Tên Category không được để trống.",
                false
            );

            return;
        }


        const input = {

            categoryName:
                categoryName,

            status:
                status
        };

        if (iconValue !== "") {

            input.icon =
                iconValue;
        }


        try {

            if (id === "") {

                await createCategory(
                    input
                );

                showMessage(
                    "Thêm Category thành công.",
                    true
                );

            } else {

                await updateCategory(
                    Number(id),
                    input
                );

                showMessage(
                    "Cập nhật Category thành công.",
                    true
                );
            }


            categoryModal.hide();


            loadCategories();

        } catch (error) {

            showMessage(
                error.message,
                false
            );
        }
    }


    async function createCategory(
            input) {

        const mutation =

            "mutation CreateCategory("
            + "$input: CategoryInput!"
            + ") {"

            + " createCategory("
            + " input: $input"
            + " ) {"

            + "   categoryId"
            + "   categoryName"
            + "   icon"
            + "   status"

            + " }"

            + "}";


        return graphqlRequest(

            mutation,

            {
                input:
                    input
            }
        );
    }


    async function updateCategory(
            id,
            input) {

        const mutation =

            "mutation UpdateCategory("
            + "$id: Int!, "
            + "$input: CategoryInput!"
            + ") {"

            + " updateCategory("
            + " id: $id, "
            + " input: $input"
            + " ) {"

            + "   categoryId"
            + "   categoryName"
            + "   icon"
            + "   status"

            + " }"

            + "}";


        return graphqlRequest(

            mutation,

            {
                id:
                    id,

                input:
                    input
            }
        );
    }

    async function deleteCategory(
            id) {

        const confirmed =
            confirm(
                "Bạn có chắc muốn xóa Category này?"
            );


        if (!confirmed) {
            return;
        }


        const mutation =

            "mutation DeleteCategory("
            + "$id: Int!"
            + ") {"

            + " deleteCategory("
            + " id: $id"
            + " )"

            + "}";


        try {

            await graphqlRequest(

                mutation,

                {
                    id:
                        id
                }
            );


            showMessage(
                "Xóa Category thành công.",
                true
            );

            await loadCategories();


        } catch (error) {

            showMessage(
                error.message,
                false
            );
        }
    }

    function showMessage(
            message,
            success) {

        const box =
            document.getElementById(
                "messageBox"
            );


        box.className =
            success

            ? "alert alert-success"

            : "alert alert-danger";


        box.textContent =
            message;
    }

    function escapeHtml(
            value) {

        if (
            value === null
            || value === undefined
        ) {

            return "";
        }


        return String(value)

            .replaceAll(
                "&",
                "&amp;"
            )

            .replaceAll(
                "<",
                "&lt;"
            )

            .replaceAll(
                ">",
                "&gt;"
            )

            .replaceAll(
                '"',
                "&quot;"
            )

            .replaceAll(
                "'",
                "&#039;"
            );
    }

</script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
